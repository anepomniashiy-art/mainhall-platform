name: Collect public project catalogue
on:
  push:
    branches: [main]
    paths: [scripts/collect-public-projects.py, scripts/public-project-sources.json, .github/workflows/collect-public-projects.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test parser contracts
        run: python3 -m unittest discover -s tests -p test_public_project_parser.py -v
      - name: Collect official public sources and source images
        run: python3 scripts/collect-public-projects.py scripts/public-project-sources.json --output collected/public-projects.json --raw-dir collected/raw --download-images collected/images --max-images 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-catalogue-evidence
          path: collected/
          retention-days: 30
