name: MAINHALL — deploy secret presence

# Reports ONLY whether each deploy-relevant secret is set (never prints values).
# Used to decide whether a main-hall.ru production cutover is possible.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Secret presence (names only, never values)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          REGRU_USERNAME: ${{ secrets.REGRU_USERNAME }}
          REGRU_PASSWORD: ${{ secrets.REGRU_PASSWORD }}
          REGRU_API: ${{ secrets.REGRU_API }}
          TILDA_PUBLICKEY: ${{ secrets.TILDA_PUBLICKEY }}
          TILDA_SECRETKEY: ${{ secrets.TILDA_SECRETKEY }}
          YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          GH_PAGES_CUSTOM_DOMAIN: ${{ secrets.GH_PAGES_CUSTOM_DOMAIN }}
        run: |
          echo "=== deploy secret presence ==="
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID \
                   CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID \
                   REGRU_USERNAME REGRU_PASSWORD REGRU_API \
                   TILDA_PUBLICKEY TILDA_SECRETKEY \
                   YC_ACCESS_KEY_ID YC_SECRET_ACCESS_KEY \
                   NETLIFY_AUTH_TOKEN GH_PAGES_CUSTOM_DOMAIN; do
            if [ -n "${!v}" ]; then echo "$v: SET"; else echo "$v: missing"; fi
          done
