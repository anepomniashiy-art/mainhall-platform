name: Deploy MAINHALL to Beget
on:
  push:
    branches: [main]
    paths: [data/**, src/**, public/**, scripts/**, package.json, package-lock.json, next.config.ts, .github/workflows/deploy-beget.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beget-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: npm ci
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/test-investment-model.cjs
      - run: npm run build:host
      - run: python3 tests/seo-export.py
      - name: Configure Beget and upload current export
        env:
          BEGET_API_PASSWORD: ${{ secrets.BEGET_API_PASSWORD }}
        run: python3 scripts/deploy-beget.py
      - name: Verify HTTPS site and permanent redirects
        run: |
          curl --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 --fail https://main-hall.ru/ -o /tmp/beget-home.html
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request
          html=Path('/tmp/beget-home.html').read_text()
          for marker in ['Павел Евтеев','Евгений Прохоров','evgeny-portrait.jpg']:
              assert marker in html, 'Missing current content: '+marker
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): return None
          opener=urllib.request.build_opener(NoRedirect)
          for host in ['main-hall.ru','www.main-hall.ru']:
              for path in ['/','/projects/','/projects/high-life/?source=ssl-check']:
                  url='http://'+host+path
                  try: response=opener.open(url,timeout=20)
                  except urllib.error.HTTPError as e: response=e
                  location=response.headers.get('Location')
                  assert response.code==301 and location=='https://main-hall.ru'+path,(url,response.code,location)
                  with urllib.request.urlopen(url,timeout=20) as final:
                      assert final.status==200 and final.url=='https://main-hall.ru'+path
                  print('VERIFIED',url,'301',location)
          for path in ['/images/team/pavel.jpg','/images/team/evgeny-portrait.jpg','/sitemap.xml']:
              with urllib.request.urlopen('https://main-hall.ru'+path,timeout=20) as response:
                  assert response.status==200
          with urllib.request.urlopen('https://main-hall.ru/sitemap.xml',timeout=20) as response:
              sitemap=response.read().decode()
              assert 'https://main-hall.ru' in sitemap and 'http://main-hall.ru' not in sitemap
          print('HTTPS content, certificate validation, redirects and sitemap verified')
          PY
