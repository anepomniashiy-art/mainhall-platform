name: MAINHALL agent contact
on:
  push:
    branches: [main]
    paths: ['.github/agent-triggers/contact.json', '.github/workflows/agent-contact.yml', 'scripts/agent-contact.cjs', 'scripts/agent-contact-cli.cjs']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
concurrency:
  group: mainhall-agent-contact
  cancel-in-progress: false
jobs:
  contact:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Receive pending request
        id: intake
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/agent-contact.cjs').prepare({github,context,core});
      - name: Reviewer — Claude Messages API
        id: reviewer
        if: steps.intake.outputs.pending == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            await require('./scripts/agent-contact.cjs').reviewer({core});
      - name: Install actual Claude Code CLI
        if: steps.intake.outputs.pending == 'true'
        run: npm install --global @anthropic-ai/claude-code
      - name: Claude Code — actual read-only repository audit
        id: executor
        if: steps.intake.outputs.pending == 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/agent-contact-cli.cjs
      - name: Return result or explicit failure to original issue
        if: always() && steps.intake.outputs.pending == 'true'
        uses: actions/github-script@v7
        env:
          REVIEWER_STATUS: ${{ steps.reviewer.outcome }}
          EXECUTOR_STATUS: ${{ steps.executor.outcome }}
        with:
          script: |
            await require('./scripts/agent-contact.cjs').finish({github,context,core});
