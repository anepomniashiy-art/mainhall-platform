name: MAINHALL Runner Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check runner
        run: |
          echo "GitHub runner started successfully"
          echo "Run ID: ${{ github.run_id }}"
      - name: Check repository checkout
        uses: actions/checkout@v4
      - name: Confirm result
        run: test -f .github/workflows/mainhall-push.yml
