name: Compare the exterior and interior editions of Luzhniki Collection
on:
  push:
    branches: [photo-review-20261126]
    paths: [.github/workflows/luzhniki-gallery-originals.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow numpy opencv-python-headless pymupdf requests beautifulsoup4
      - run: python scripts/compare-luzhniki-gallery-originals.py
        env:
          PAGES: luzhniki-gallery-originals.json
          GROUPS_COUNT: "1"
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luzhniki-source-${{ matrix.shard }}
          path: results/
          retention-days: 7
  proofs:
    runs-on: ubuntu-latest
    needs: compare
    if: always()
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: photo-review-20261126
      - uses: actions/download-artifact@v4
        with:
          pattern: luzhniki-source-*
          path: /tmp/photo-results
          merge-multiple: true
      - name: Record matched pairs and proof images on the review branch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          work=Path('/tmp/photo-results')
          target=Path('reports/photo-review-20261126/luzhniki-gallery-originals')
          rows=[]
          for folder in sorted(work.iterdir()):
              saved=target/folder.name
              saved.mkdir(parents=True,exist_ok=True)
              if (folder/'covers').is_dir():
                  for subject in (folder/'covers').iterdir():
                      leaf=target/'covers'/subject.name
                      leaf.mkdir(exist_ok=True,parents=True)
                      for proof in subject.glob('index*'):
                          shutil.copyfile(proof,leaf/proof.name)
              for p in folder.glob('*'):
                  if p.is_file(): shutil.copyfile(p,saved/p.name)
              if (folder/'matches.json').is_file():
                  matches=json.loads((folder/'matches.json').read_text())
                  rows+=matches
                  for item in matches:
                      source=folder/'candidates'/Path(item['target']).name
                      dest=target/'candidates'/source.name
                      dest.parent.mkdir(exist_ok=True)
                      shutil.copyfile(source,dest)
          print('Prepared',len(rows),'pairs',flush=True)
          (target/'all.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/photo-review-20261126/luzhniki-gallery-originals/
          git commit -m "Stage the matched official frames for visual acceptance" && git pull --rebase origin photo-review-20261126 && git push origin HEAD:photo-review-20261126
