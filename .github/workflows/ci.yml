name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholder only. Prisma schema needs the var to parse; no real DB is contacted.
      DATABASE_URL: "postgresql://user:password@localhost:5432/mainhall?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
      - name: Static export and commercial asset check
        run: npm run build:static
      - name: Verify SEO static export
        run: python3 tests/seo-export.py
      - name: Data-contract tests
        run: node --test tests/official-feed.test.mjs

