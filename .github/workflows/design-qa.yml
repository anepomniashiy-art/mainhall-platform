name: Design browser QA
on:
  push:
    branches: [main, codex/minimal-design]
    paths: [".github/workflows/design-qa.yml", "tests/design-smoke.mjs", "src/**", "public/images/**", "public/fonts/**", "public/projects/**", "package*.json"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/mainhall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build:host
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Prepare official Text-to-Lottie verification player
        run: |
          git clone --depth 1 https://github.com/diffusionstudio/lottie.git /tmp/lottie-studio
          mkdir -p /tmp/lottie-studio/public/projects/mainhall/scene-1
          cp public/projects/mainhall/scene-1/lottie.json /tmp/lottie-studio/public/projects/mainhall/scene-1/lottie.json
          cd /tmp/lottie-studio
          npm install
      - name: Verify desktop, mobile and reduced motion
        run: |
          python3 -m http.server 8091 --directory out > /tmp/mainhall-preview.log 2>&1 &
          (cd /tmp/lottie-studio && npm run dev -- --host 127.0.0.1 > /tmp/lottie-studio.log 2>&1) &
          curl --retry 20 --retry-connrefused --retry-delay 1 -sf http://127.0.0.1:3030/__context > /tmp/lottie-context.json
          LOTTIE_STUDIO_URL=http://127.0.0.1:3030 node tests/design-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mainhall-design-screenshots
          path: design-proof/
