name: Investment browser QA
on:
  push:
    branches: [main]
    paths: [src/**, data/catalogue/investment-archive.json, tests/investment-browser.mjs, .github/workflows/investment-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:host
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Verify investment pages and calculations
        run: |
          python3 -m http.server 8091 --directory out > /tmp/investment-preview.log 2>&1 &
          node tests/investment-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investment-browser-proof
          path: investment-proof/
