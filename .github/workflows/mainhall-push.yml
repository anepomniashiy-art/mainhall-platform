name: MAINHALL Push Agent Pipeline

# Event-driven coordination: an owner issue/comment triggers OpenAI planning
# and real Claude Code execution IN THE SAME RUN. No bot-comment recursion.
on:
  push:
    branches: [main]
    paths:
      - '.github/agent-triggers/execute.txt'
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number to execute"
        required: true
        default: "7"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

concurrency:
  group: mainhall-push-${{ github.event.issue.number || inputs.issue_number || '7' || github.run_id }}
  cancel-in-progress: false

jobs:
  coordinate-and-execute:
    # Only trusted owner initiates a paid agent run; ignore bot and unrelated events.
    if: >-
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.actor == 'anepomniashiy-art' &&
       (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' && github.event.label.name == 'execute' && github.event.issue.pull_request == null) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request == null &&
        (contains(github.event.comment.body, '[EXECUTE]') ||
         contains(github.event.comment.body, '@claude'))))))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Coordinator — GPT API
        id: coordinator
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TARGET_ISSUE: ${{ github.event.issue.number || inputs.issue_number || '7' }}
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const issue_number=Number(process.env.TARGET_ISSUE);
            if (!Number.isInteger(issue_number)||issue_number<1) throw Error('Invalid issue number');
            const issue=(await github.rest.issues.get({owner,repo,issue_number})).data;
            const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number,per_page:100});
            const task = [
              'You are MAINHALL project coordinator, not the coding executor.',
              'Find ONE concrete, achievable technical next action for real Claude Code.',
              'Owner approved production cutover only AFTER legacy backup/subdomain and verified rollback; never alter root before those checks.',
              'Preserve privacy and credentials. No invented data or statements of success.',
              'Issue title: '+issue.title,
              'Issue body: '+String(issue.body||'').slice(0,9000),
              'Latest comments: '+comments.slice(-5).map(c=>String(c.body||'').slice(0,1500)).join('\n---\n'),
              'Return <=1200 characters of precise implementation direction. No markdown preamble.'
            ].join('\n');
            if (!process.env.OPENAI_API_KEY) throw Error('Missing OPENAI_API_KEY GitHub Secret');
            const response=await fetch('https://api.openai.com/v1/chat/completions',{
              method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+process.env.OPENAI_API_KEY},
              body:JSON.stringify({model:'gpt-4o',max_tokens:650,messages:[{role:'user',content:task}]})
            });
            if(!response.ok) throw Error('Coordinator API HTTP '+response.status);
            const json=await response.json();
            const plan=String(json.choices?.[0]?.message?.content||'').slice(0,1800).trim();
            if(!plan) throw Error('Empty coordinator plan');
            core.setOutput('plan',plan);
            core.setOutput('issue',String(issue_number));
            console.log('Coordinator proposed task for issue #'+issue_number+' ('+plan.length+' chars)');

      - name: Capture baseline PR state
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const prs=await github.paginate(github.rest.pulls.list,{owner:context.repo.owner,repo:context.repo.repo,state:'all',per_page:100});
            core.setOutput('pr_numbers',prs.map(p=>p.number).join(','));
            console.log('PR baseline recorded: '+prs.length);

      - name: Execute — Claude Code CLI
        id: executor
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          additional_permissions: |
            actions: read
          prompt: |
            You are the ACTUAL MAINHALL coding executor, not a text conversation simulator.
            Work on owner-authorized issue #${{ steps.coordinator.outputs.issue }}.
            GPT coordinator task:
            ${{ steps.coordinator.outputs.plan }}

            Use branch claude/push-${{ github.run_id }} exclusively. Target main. Include the exact marker
            <!-- mainhall-task:${{ steps.coordinator.outputs.issue }}:run:${{ github.run_id }} --> in the PR body.
            Do not modify workflows, secrets, DNS or production in this task.
            CRITICAL: do not end with just a text reply. Make a tangible source-code change,
            run tests, create a feature branch AND open a PR. If unable, explain the precise technical blocker.
            Preserve existing commercial website and backup/rollback plan before DNS cutover.
            Never claim a deployment, API feed, pricing, rights or result without evidence.
            Never expose secrets. Report proof with commit/PR URL and test logs.
            If blocked, report exact missing access on the issue; do not fabricate completion.
          claude_args: '--max-turns 30 --allowedTools "Read,Write,Edit,Glob,Grep,Bash"'

      - name: Verify deliverable and report back to issue
        if: always() && steps.coordinator.outputs.issue != ''
        uses: actions/github-script@v7
        env:
          TARGET_ISSUE: ${{ steps.coordinator.outputs.issue }}
          BASELINE_PRS: ${{ steps.baseline.outputs.pr_numbers }}
          COORDINATOR_STATUS: ${{ steps.coordinator.outcome }}
          EXECUTOR_STATUS: ${{ steps.executor.outcome }}
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const issue_number=Number(process.env.TARGET_ISSUE);
            const before=new Set((process.env.BASELINE_PRS||'').split(',').filter(Boolean).map(Number));
            const all=await github.paginate(github.rest.pulls.list,{owner,repo,state:'all',per_page:100});
            const marker='<!-- mainhall-task:'+issue_number+':run:'+context.runId+' -->';
            const created=all.filter(p=>!before.has(p.number) && p.head.repo?.full_name===owner+'/'+repo && p.head.ref==='claude/push-'+context.runId && p.base.ref==='main' && p.body?.includes(marker));
            for (const p of created) {
              const files=await github.paginate(github.rest.pulls.listFiles,{owner,repo,pull_number:p.number,per_page:100});
              if (!files.length) throw Error('PR has no changed files');
            }
            const report=[
              '[AUTOMATION REPORT] GitHub Push Agent Pipeline',
              'Run: '+context.serverUrl+'/'+owner+'/'+repo+'/actions/runs/'+context.runId,
              'New PR created during this run: '+(created.length?created.map(p=>p.html_url).join(', '):'NONE VERIFIED'),
              'Coordinator: '+process.env.COORDINATOR_STATUS+'; executor: '+process.env.EXECUTOR_STATUS,
              'Status: '+(created.length?'PR CREATED — CI still requires independent verification':'NO PR — execution goal not satisfied'),
              'This message is machine-generated from GitHub PR API; a successful action step alone is NOT proof of code delivery.',
              '<!-- mainhall-push-result:'+context.runId+' -->'
            ].join('\n');
            await github.rest.issues.createComment({owner,repo,issue_number,body:report});
            if(process.env.EXECUTOR_STATUS !== 'success') core.setFailed('Executor failed; see run logs');
            if(!created.length) core.setFailed('Claude Code did not create a verifiable PR; inspect executor step logs');
