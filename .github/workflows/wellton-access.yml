name: Wellton hosting access check
on:
  push:
    branches: [codex/wellton-access-20261117]
    paths: [.github/workflows/wellton-access.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconnect to existing Wellton API and FTPS
        env:
          BEGET_API_PASSWORD: ${{ secrets.BEGET_API_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error,ftplib,ssl,io,hashlib
          password=os.environ.get('BEGET_API_PASSWORD','')
          print('CREDENTIAL_CONFIGURED',bool(password),flush=True)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          try:
           data=urllib.parse.urlencode({'login':'wellton','passwd':password,'input_format':'json','output_format':'json','input_data':'{}'}).encode()
           r=opener.open(urllib.request.Request('https://api.beget.com/api/site/getList',data=data),timeout=20)
           j=json.load(r)
           print('API_STATUS',j.get('status'),j.get('answer',{}).get('status'),flush=True)
           if isinstance(j.get('answer',{}).get('result'),list):
            print('TARGET_SITES',[x.get('path') for x in j['answer']['result'] if 'welltonproperty.com' in x.get('path','')],flush=True)
          except Exception as e: print('API_UNAVAILABLE',type(e).__name__,getattr(e,'code',None),flush=True)
          class TLS(ftplib.FTP_TLS):
           def ntransfercmd(self,cmd,rest=None):
            c,s=ftplib.FTP.ntransfercmd(self,cmd,rest)
            if self._prot_p:c=self.context.wrap_socket(c,server_hostname=self.host,session=self.sock.session)
            return c,s
          context=ssl.create_default_context()
          context.maximum_version=ssl.TLSVersion.TLSv1_2
          for host in ['wellton.beget.tech','urdak.beget.com']:
           f=TLS(context=context,timeout=20)
           try:
            f.connect(host,21); f.host='wellton.beget.tech'
            f.login('wellton',password);f.prot_p()
            print('FTPS_AUTHENTICATED',host,flush=True)
            f.cwd('/welltonproperty.com/public_html')
            print('TARGET_ROOT_CONFIRMED',f.pwd(),flush=True)
            for name in ['index.php','style-preview-taste/production.php','style-preview-taste/production.css']:
             b=io.BytesIO();f.retrbinary('RETR '+name,b.write)
             print('REMOTE_FILE',name,len(b.getvalue()),hashlib.sha256(b.getvalue()).hexdigest(),flush=True)
            f.quit();break
           except ftplib.error_perm as e:
            print('FTPS_REJECTED',host,str(e)[:3],flush=True);f.close();break
           except Exception as e:
            print('FTPS_UNAVAILABLE',host,type(e).__name__,flush=True);f.close()
          for path in ['/ru/reviews/','/style-preview-taste/production.css']:
           try:
            r=urllib.request.urlopen('https://welltonproperty.com'+path,timeout=20);b=r.read()
            print('PUBLIC',path,r.status,len(b),hashlib.sha256(b).hexdigest(),flush=True)
           except Exception as e:print('PUBLIC_UNAVAILABLE',path,type(e).__name__,flush=True)
          PY
