name: Verify and collect project photo galleries
on:
  push:
    branches: [main]
    paths: [data/provenance/project-photo-collection.json, data/provenance/additional-project-photo-collection.json, scripts/collect-project-photo-pack.py, .github/workflows/project-photo-pack.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python scripts/collect-project-photo-pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-project-photo-pack
          path: photo-pack/
