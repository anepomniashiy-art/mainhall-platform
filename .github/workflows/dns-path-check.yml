name: Compare authoritative DNS and GitHub Pages validation
on:
  push:
    branches: [main]
    paths: [.github/workflows/dns-path-check.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read GitHub Pages validation
        env:
          GH_TOKEN: ${{ secrets.MAINHALL_PAGES_TOKEN || github.token }}
        run: |
          gh api repos/anepomniashiy-art/mainhall-platform/pages --jq '{cname,https_certificate,https_enforced}'
          gh api repos/anepomniashiy-art/mainhall-platform/pages/health || true
      - name: Compare current delegation and direct authoritative answers
        run: |
          for server in a.dns.ripn.net 1.1.1.1 8.8.8.8 brian.ns.cloudflare.com sandra.ns.cloudflare.com; do
            for kind in NS A AAAA CAA DS; do
              echo "DNS $server main-hall.ru $kind"
              dig @"$server" main-hall.ru "$kind" +time=3 +tries=2 +noall +comments +answer +authority || true
            done
            echo "DNS $server www.main-hall.ru CNAME"
            dig @"$server" www.main-hall.ru CNAME +time=3 +tries=2 +noall +comments +answer +authority || true
          done
          for url in http://main-hall.ru/ https://main-hall.ru/ https://www.main-hall.ru/; do
            echo "HTTP $url"
            curl --max-time 15 -sS -L -o /tmp/page -w 'status=%{http_code} final=%{url_effective} ssl=%{ssl_verify_result}\n' "$url" || true
          done
