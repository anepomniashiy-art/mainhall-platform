name: "Deploy to GitHub Pages"
# Deploy the canonical main branch (MAINHALL Next app) + the preserved /legacy/ site.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:static
      - name: Verify crawlability, metadata and internal links
        run: python3 tests/seo-export.py
      - name: Copy CNAME and legacy site into output
        run: |
          cp CNAME out/CNAME
          if [ -d legacy ]; then
            cp -r legacy out/legacy
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Pages configuration
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" --jq '{cname, html_url, https_enforced, https_certificate, status}'
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify production DNS and HTTP
        if: success()
        continue-on-error: true
        run: |
          for host in main-hall.ru www.main-hall.ru; do
            echo "DNS: $host"
            dig +short "$host" A
            dig +short "$host" AAAA
            dig +short "$host" CNAME
            dig +short "$host" CAA
          done
          curl --fail --location --max-time 30 --output /tmp/mainhall-http.html --write-out 'HTTP status=%{http_code} URL=%{url_effective}\n' http://main-hall.ru/
          curl --fail --location --max-time 30 --output /tmp/mainhall.html --write-out 'HTTPS status=%{http_code} URL=%{url_effective}\n' https://main-hall.ru/
          grep -o '<title>[^<]*' /tmp/mainhall.html

      - name: Notify Yandex IndexNow for the reachable production origin
        if: success()
        run: python3 scripts/notify-indexnow.py
