name: "Deploy to GitHub Pages"
# Deploy the canonical main branch (MAINHALL Next app) + the preserved /legacy/ site.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:static
      - name: Verify crawlability, metadata and internal links
        run: python3 tests/seo-export.py
      - name: Copy CNAME and legacy site into output
        run: |
          cp CNAME out/CNAME
          if [ -d legacy ]; then
            cp -r legacy out/legacy
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Pages configuration
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MAINHALL_PAGES_TOKEN || github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" --jq '{cname, html_url, https_enforced, https_certificate, status}'
      - name: Diagnose Pages validation and authoritative DNS
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MAINHALL_PAGES_TOKEN || github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages/health" || true
          for resolver in 1.1.1.1 8.8.8.8; do
            for type in NS A CAA DS; do
              echo "DNS resolver=$resolver host=main-hall.ru type=$type"
              dig @"$resolver" main-hall.ru "$type" +time=2 +tries=1 +noall +comments +answer +authority || true
            done
          done
          for server in ns1.reg.ru ns2.reg.ru; do
            for host in main-hall.ru www.main-hall.ru; do
              for type in A CAA; do
                echo "AUTHORITATIVE server=$server host=$host type=$type"
                dig @"$server" "$host" "$type" +time=2 +tries=1 +noall +comments +answer +authority || true
                dig @"$server" "$host" "$type" +tcp +time=2 +tries=1 +noall +comments +answer +authority || true
              done
            done
          done
          gh api "repos/${{ github.repository }}/pages/health" || true
      - name: Reproduce validation with GitHub's public health checker
        continue-on-error: true
        timeout-minutes: 3
        run: |
          gem install --user-install github-pages-health-check --no-document
          ruby -r github-pages-health-check -r json -e '
            ["main-hall.ru", "www.main-hall.ru"].each do |host|
              domain = GitHubPages::HealthCheck::Domain.new(host)
              puts JSON.generate(domain.to_hash)
              GitHubPages::HealthCheck::Domain::REQUESTED_RECORD_TYPES.each do |type|
                begin
                  puts JSON.generate({host: host, type: type.to_s, answers: domain.resolver.query(type).map(&:to_s)})
                rescue StandardError => e
                  puts JSON.generate({host: host, type: type.to_s, error: e.class.name, message: e.message})
                end
              end
            end
          '
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the live document on both production hosts
        if: success()
        run: python3 scripts/check-production.py
      - name: Verify production DNS and HTTP
        if: success()
        continue-on-error: true
        run: |
          for host in main-hall.ru www.main-hall.ru; do
            echo "DNS: $host"
            dig +short "$host" A
            dig +short "$host" AAAA
            dig +short "$host" CNAME
            dig +short "$host" CAA
          done
          curl --fail --location --max-time 30 --output /tmp/mainhall-http.html --write-out 'HTTP status=%{http_code} URL=%{url_effective}\n' http://main-hall.ru/
          curl --fail --location --max-time 30 --output /tmp/mainhall.html --write-out 'HTTPS status=%{http_code} URL=%{url_effective}\n' https://main-hall.ru/
          grep -o '<title>[^<]*' /tmp/mainhall.html

      - name: Notify Yandex IndexNow for the reachable production origin
        if: success()
        run: python3 scripts/notify-indexnow.py
