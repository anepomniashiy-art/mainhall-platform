name: Agent relay transport tests
on:
  push:
    paths: ["ops/relay/**", ".github/workflows/agent-relay.yml"]
  pull_request:
    paths: ["ops/relay/**", ".github/workflows/agent-relay.yml"]
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s ops/relay/tests -v
