name: Rating data — OpenStreetMap points for Moscow
on:
  workflow_dispatch:
    inputs:
      categories:
        description: "Space-separated categories (empty = all): station station_future school kindergarten clinic shop park park_geom park_rel park_nat"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: collect
        timeout-minutes: 180
        continue-on-error: true
        env:
          CATEGORIES: ${{ github.event.inputs.categories }}
        run: python3 -u scripts/rating/collect_osm_moscow.py $CATEGORIES
      - name: publish to data branch
        if: always()
        run: |
          ls -la out || exit 0
          mkdir pub && cp out/*.gz pub/ && cd pub
          git init -q -b data-rating-osm-run
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "osm moscow $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-rating-osm-run
          ls -la
