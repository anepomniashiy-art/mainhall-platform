name: Deploy MAINHALL to Netherlands server
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dispatch-mainhall-nl
  cancel-in-progress: true
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Request tested deployment on the Netherlands server
        env:
          GH_TOKEN: ${{ secrets.BRIDGE_PAT }}
          SOURCE_REF: ${{ github.sha }}
        run: |
          test -n "$GH_TOKEN"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/anepomniashiy-art/north-cyprus/dispatches \
            -d "{\"event_type\":\"mainhall-deploy\",\"client_payload\":{\"ref\":\"$SOURCE_REF\"}}"
          echo "Deployment dispatched for $SOURCE_REF"
