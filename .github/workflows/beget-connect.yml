name: Beget hosting connection
on:
  push:
    branches: [main]
    paths: [.github/workflows/beget-connect.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect target hosting and web address
        env:
          BEGET_API_PASSWORD: ${{ secrets.BEGET_API_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,socket,subprocess
          password=os.environ['BEGET_API_PASSWORD']
          if not password: raise SystemExit('BEGET_API_PASSWORD is missing')
          def api(method,args={}):
              data=urllib.parse.urlencode({'login':'wellton','passwd':password,'input_format':'json','output_format':'json','input_data':json.dumps(args)}).encode()
              result=json.load(urllib.request.urlopen(urllib.request.Request('https://api.beget.com/api/'+method,data=data),timeout=30))
              if result.get('status')!='success': raise SystemExit('API error')
              return result['answer'].get('result')
          print('TARGET_SITE',json.dumps([s for s in api('site/getList') if s['path']=='main-hall.ru/public_html']))
          print('TARGET_DNS',json.dumps(api('dns/getData',{'fqdn':'main-hall.ru'})))
          for host in ['wellton.beget.tech','urdak.beget.com']:
              ip=socket.gethostbyname(host)
              print('HOST_IP',host,ip,flush=True)
              for path in ['/','/images/team/pavel.jpg','/images/team/evgeny-portrait.jpg','/projects/']:
                  result=subprocess.run(['curl','--max-time','15','-sS','--resolve','main-hall.ru:80:'+ip,'http://main-hall.ru'+path,'-o','/dev/null','-w','%{http_code}'],capture_output=True,text=True)
                  print('ORIGIN',ip,path,result.stdout,flush=True)
          PY
