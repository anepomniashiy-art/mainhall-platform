name: Prepare catalogue photo replacements
on:
  push:
    branches: [photo-review-20261126]
    paths: [.github/workflows/prepare-photo-review.yml]
permissions:
  actions: read
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: photo-review-20261126
      - uses: actions/download-artifact@v4
        with:
          name: catalogue-photo-review
          run-id: 45821106467
          github-token: ${{ github.token }}
          path: /tmp/photo-review
      - name: Prepare a review copy of each matched official photograph
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import json, shutil, hashlib, urllib.request
          from PIL import Image,ImageOps
          review = Path('/tmp/photo-review')
          out = Path('reports/photo-review-20261126')
          out.mkdir(parents=True, exist_ok=True)
          rows = json.loads((review/'matches.json').read_text())
          for row in rows:
              src = row['source']
              if src.startswith('/'):
                  raw = (Path('public')/src.lstrip('/')).read_bytes()
              else:
                  with urllib.request.urlopen(urllib.request.Request(src,headers={'User-Agent':'Mainhall catalogue photography'}), timeout=24) as response:
                      raw = response.read(25_000_001)
              if len(raw)>25_000_000:
                  raise ValueError('Oversized official image')
              image = ImageOps.exif_transpose(Image.open(BytesIO(raw))).convert('RGB')
              image.thumbnail((2400,2400))
              if Path(row['target']).suffix.lower() not in ('.jpg','.jpeg'):
                  raise ValueError('Unexpected destination format')
              path=out/'candidates'/Path(row['target']).name
              path.parent.mkdir(exist_ok=True)
              image.save(path,format='JPEG',quality=91,optimize=True)
              row['candidate']=str(path)
              row['sha256']=hashlib.sha256(path.read_bytes()).hexdigest()
          (out/'matches.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          for path in review.glob('matches-*.jpg'):
              shutil.copyfile(path,out/path.name)
          for path in review.glob('laym-*'):
              shutil.copyfile(path,out/path.name)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/photo-review-20261126/
          git commit -m "Prepare 15 project image pairs for visual review"
          git push origin HEAD:photo-review-20261126
