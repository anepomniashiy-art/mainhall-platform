name: Move MAINHALL to the Russian Timeweb server
on:
  push:
    branches: [main]
    paths: [.github/workflows/cutover-ru.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mainhall-domain-cutover
  cancel-in-progress: false
jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Russian content and switch web DNS with rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: python3 scripts/cutover-russian-host.py
      - name: Report public DNS and HTTPS
        run: |
          dig @1.1.1.1 main-hall.ru A +short
          dig @8.8.8.8 www.main-hall.ru CNAME +short
          for url in https://main-hall.ru/ https://www.main-hall.ru/; do
            curl --fail --silent --show-error --location --max-time 30 -o /dev/null -w "$url HTTP=%{http_code} TLS=%{ssl_verify_result}\n" "$url"
          done
      - name: Notify search engines of the current public pages
        run: python3 scripts/notify-indexnow.py
